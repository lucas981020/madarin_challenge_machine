<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國文形音義練習</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2622;--mut:#7a7269;--card:#fff;--bd:#e3dccf;--ac:#b5452f;--ok:#2f7d4f;--bad:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#efe9df;--mut:#a39a8d;--card:#27241f;--bd:#3c372f;--ac:#e07a5f;--ok:#6cc08b;--bad:#ef7b6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#efe9df;--mut:#a39a8d;--card:#27241f;--bd:#3c372f;--ac:#e07a5f;--ok:#6cc08b;--bad:#ef7b6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100dvh;display:flex;flex-direction:column}
#app{max-width:640px;width:100%;margin:0 auto;padding:20px 16px 24px;box-sizing:border-box;flex:1}
footer{max-width:640px;width:100%;margin:0 auto;padding:12px 16px 24px;box-sizing:border-box;text-align:center;color:var(--mut);font-size:.82rem;line-height:1.5}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1rem;color:var(--mut);margin:1.2em 0 .4em}
.m{color:var(--mut);font-size:.9rem}.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 16px;border-radius:10px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.go{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:18px;width:100%;padding:12px}
button:disabled{opacity:.4}button.ghost{background:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:12px}
.q{font-size:1.4rem;line-height:2.1}.card.okc{border-color:var(--ok);border-width:2px}.card.badc{border-color:var(--bad);border-width:2px}.vd{font-size:1.3rem;font-weight:700;margin:.5em 0}.t{color:var(--ac)}
u.z{text-decoration:none;font-size:.8em;border-bottom:2px solid var(--ac);padding:0 2px}
u.h{text-decoration:none;border-bottom:2px solid var(--ac)}
input{font:inherit;font-size:1.15rem;width:7em;max-width:40vw;padding:4px 8px;border:1px solid var(--bd);border-bottom:2px solid var(--ac);border-radius:6px;background:var(--bg);color:var(--fg);margin:2px 4px}
.ins{margin-top:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
hr{border:0;border-top:1px solid var(--bd);margin:24px 0}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem}
</style></head><body><div id="app"></div><footer>若有錯誤或疑慮之處，造成不便之處深感抱歉，請通知 IG: lucasowo._.1020 提醒我，我會立刻進行修正！</footer>
<script>
const RAW=`##散戲
布(帘12)：布幔，多掛於門上
(鍘12)美案
悠哉悠哉：形容悠閒自得的樣子
(晃2)回來：遊逛、閒逛
喜孜孜：形容喜悅高興的樣子
孜(孜12)：不停歇貌
(別)過頭：轉
(哄2)：安撫
挑(剔2)
人聲(鼎1)沸：指人聲嘈雜，如鍋中的水沸聲
木然：形容面無表情的樣子
(佝12僂12)：駝背
(悸2)動：指因感慨而情緒激動
(噤2)聲：閉口不言
##唐宋詩選
暮(投)石壕村：留宿
逾牆走：翻牆逃跑
(逾12)牆走：越過
逾牆(走)：跑
(一何)：何等、多麼
(致詞)：訴說
三男鄴城(戍12)：防守
一男(附書)至：捎信、寄信
二男(新)戰死：剛剛、新近
長(已)矣：停止，此指生命結束
幽(咽12)
登(前途)：前方道路
寄雁傳書(謝)不能：推辭、拒絕
持家(但)有四立壁：只
治病不(蘄2)三折肱：通「祈」，祈求
治病不蘄三折(肱2)：手臂
(想得)：料想
(瘴2)煙
##赤壁賦
(既)望：......之後
既(望)：陰曆十五日
月出皎兮，(佼人)僚兮：美人
(舒窈)糾兮，勞心悄兮：即「窈窕」，形容步履舒緩，體態優美
舒窈糾兮，(勞心)悄兮：憂心
舒窈糾兮，勞心(悄)兮：憂愁貌
(窈12窕12)
(少2)焉：不久
(斗牛)：此泛指星斗
(縱2)一葦之所如：任憑
縱(一葦)之所如：此喻小舟
縱一葦之所(如)：往
(凌)萬頃之茫然：越過
(浩浩)乎如馮虛御風：廣大無邊的樣子
浩浩乎如馮(虛)御風：天空
浩浩乎如馮虛(御風)：駕風、乘風
(遺)世：遠離
羽化而登(僊12)：同「仙」
(扣舷)：敲打船邊
桂(棹12)兮蘭槳：船槳
擊(空明)兮泝流光：指倒映在江水中的月影
擊空明兮(泝12)流光：同「溯」：逆水上行
(渺渺)：悠遠的樣子
(美人)：指國君
(嫋12嫋12)：形容簫聲繚繞悠揚
(舞)幽壑之潛蛟：使...舞動
舞幽(壑12)之潛蛟：深谷、深淵
舞幽壑之潛(蛟2)
(泣)孤舟之嫠婦：使...悲泣
泣孤舟之(嫠)婦：寡婦
(愀12)然：神色改變的樣子
(正襟危坐)：形容嚴肅的樣子
正襟(危)坐：端正
何為其(然)也：如此
(相繚)：互相環繞
相(繚12)：纏繞
(鬱)乎蒼蒼：茂盛
鬱乎(蒼蒼)：深青色
方其(破)荊州：攻破
(下)江陵：順流而下
(舳艫千里)：船隻相接，綿延千里，極言戰艦之多
(舳12)艫千里：船頭
舳(艫12)千里：船尾
(旌旗蔽空)：形容軍容壯盛
(橫槊賦詩)：形容允文允武，義氣自得的樣子
橫(槊12)賦詩：長矛
漁樵於江(渚12)之上：水中沙洲
(扁2)舟
匏(樽)：酒器
寄(蜉12蝣12)於天地：比喻人生短促
渺滄海之一(粟12)：穀類的總稱
(挾2)飛仙以遨遊：夾在腋下，在此有偕同之意
知乎不可(驟12)得：急速，此有「輕易」之意
(遺)響：殘餘
逝者如(斯)，而未嘗往也：指江水
盈虛者如(彼)，而卒莫消長也：指月亮
蓋(將)自其變者而觀之：如果
(曾2)不能以一瞬：竟
曾不能以一(瞬)：眨眼，比喻短暫的時間
造物者之無盡(藏2)
而吾與子之所共(食)：享用、享受
洗盞(更2)酌：重新
(肴12)核既盡：同「餚」
杯盤(狼)(籍2)：也作「狼藉」，散亂的樣子
(枕2藉2)：意謂相枕而臥。
枕(籍)：倚臥
東方之(既)白：已經`;
/* 註：「一何」「致詞」「想得」「斗牛」「扣舷」「渺渺」「美人」「正襟危坐」「相繚」「舳艫千里」「旌旗蔽空」「橫槊賦詩」等，原清單為詞語註釋，已用括號標出被註釋的詞 */
const Z={帘:'ㄌㄧㄢˊ',鍘:'ㄓㄚˊ',孜:'ㄗ',晃:'ㄏㄨㄤˋ',更:'ㄍㄥ',哄:'ㄏㄨㄥˇ',剔:'ㄊㄧ',佝:'ㄎㄡˋ',僂:'ㄌㄡˊ',鼎:'ㄉㄧㄥˇ',悸:'ㄐㄧˋ',噤:'ㄐㄧㄣˋ',逾:'ㄩˊ',戍:'ㄕㄨˋ',咽:'ㄧㄝˋ',蘄:'ㄑㄧˊ',肱:'ㄍㄨㄥ',瘴:'ㄓㄤˋ',窈:'ㄧㄠˇ',窕:'ㄊㄧㄠˇ',少:'ㄕㄠˇ',縱:'ㄗㄨㄥˋ',僊:'ㄒㄧㄢ',棹:'ㄓㄠˋ',泝:'ㄙㄨˋ',嫋:'ㄋㄧㄠˇ',壑:'ㄏㄨㄛˋ',蛟:'ㄐㄧㄠ',愀:'ㄑㄧㄠˇ',繚:'ㄌㄧㄠˊ',舳:'ㄓㄨˊ',艫:'ㄌㄨˊ',槊:'ㄕㄨㄛˋ',渚:'ㄓㄨˇ',扁:'ㄆㄧㄢ',匏:'ㄆㄠˊ',樽:'ㄗㄨㄣ',蜉:'ㄈㄨˊ',蝣:'ㄧㄡˊ',粟:'ㄙㄨˋ',挾:'ㄒㄧㄚˊ',驟:'ㄗㄡˋ',曾:'ㄗㄥ',藏:'ㄗㄤˋ',狼:'ㄌㄤˊ',籍:'ㄐㄧˊ',枕:'ㄓㄣˋ',藉:'ㄐㄧㄝˋ',肴:'ㄧㄠˊ'};
const PRE=['......','此泛指','此喻','此指','也作','比喻','極言','意謂','形容','指','即'];
function tmpl(a){
 let m=a.match(/^(同|通)「(.+?)」(?:([：，])(.+))?$/);
 if(m)return m[4]?{t:[m[1]+'「','」'+m[3],''],b:[m[2],m[4]]}:{t:[m[1]+'「','」'],b:[m[2]]};
 m=a.match(/^(即|也作)「(.+?)」，(形容)?(.*?)(的樣子)?$/);
 if(m)return{t:[m[1]+'「','」，'+(m[3]||''),m[5]||''],b:[m[2],m[4]]};
 let pre='';for(const p of PRE)if(a.startsWith(p)){pre=p;a=a.slice(p.length);break}
 let suf='';m=a.match(/^(.*?)(的樣子|貌|。)$/);if(m&&m[1]){a=m[1];suf=m[2]}
 m=a.match(/^(.+?)(，(?:在此有|此有|此指|此喻|此泛指|比喻|極言|形容))(.*?)(之意)?$/);
 if(a==='簫聲繚繞悠揚'&&pre==='形容')return{t:['形容簫聲'],b:['繚繞悠揚']};
 if(m&&m[3])return{t:[pre,m[2],(m[4]||'')+suf],b:[m[1],m[3]]};
 return{t:[pre,suf],b:[a]};
}
const Q=[];let lesson='';
RAW.split('\n').forEach((l,li)=>{
 l=l.trim();if(!l)return;
 if(l.startsWith('##')){lesson=l.slice(2);return}
 const i=l.indexOf('：'),left=i<0?l:l.slice(0,i),ann=i<0?'':l.slice(i+1);
 const parts=left.split(/(\([^)]*\))/),groups=[];
 parts.forEach((p,k)=>{if(p[0]=='('){const chars=[];for(const m of p.slice(1,-1).matchAll(/([^\d]+)(\d*)/g))for(const c of m[1])chars.push({c,f:m[2]});groups.push({k,chars})}});
 const view=(tk,mode)=>parts.map((p,k)=>{
  const g=groups.find(g=>g.k==k);if(!g)return p;
  const plain=g.chars.map(x=>x.c).join('');
  if(mode=='義')return`<b class="t">「${plain}」</b>`;
  if(k!=tk)return plain;
  return`<b class="t">「${g.chars.map(x=>mode=='形'&&x.f.includes('1')?`<u class="z">${Z[x.c]}</u>`:mode=='音'&&x.f.includes('2')?`<u class="h">${x.c}</u>（ ）`:x.c).join('')}」</b>`}).join('');
 groups.forEach((g,gi)=>[['1','形','han'],['2','音','zy']].forEach(([f,mode,type])=>{
  const fl=g.chars.filter(x=>x.f.includes(f));
  if(!fl.length||fl.some(x=>!Z[x.c]))return;
  Q.push({id:`${lesson}|${mode}|${li}|${gi}`,lesson,mode,type,html:view(g.k,mode),ans:fl.map(x=>type=='han'?x.c:Z[x.c])});
 }));
 if(ann&&groups.length){
  const T=tmpl(ann),q={id:`${lesson}|義|${li}`,lesson,mode:'義',type:'txt',html:view(-1,'義'),t:T.t,ans:T.b};
  if(left==='二男(新)戰死')q.accept=[['剛剛','新近']];
  Q.push(q)
 }
});
const $=s=>document.querySelector(s),app=$('#app');
let W=new Set();try{W=new Set(JSON.parse(localStorage.getItem('w')||'[]'))}catch(e){}
const sv=()=>{try{localStorage.setItem('w',JSON.stringify([...W]))}catch(e){}};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=(s,t)=>t=='zy'?s.replace(/[\sˉ]/g,'').replace(/一/g,'ㄧ'):t=='txt'?s.replace(/[\s「」『』，。、．.…:：;；,]/g,''):s.trim();
let sel={l:new Set(['散戲']),m:'形'},S;
function home(){if(S)clearTimeout(S.tm);
 const L=[...new Set(Q.map(q=>q.lesson))],M=[['形','字形'],['音','字音'],['義','註釋']];
 const n=Q.filter(q=>sel.l.has(q.lesson)&&q.mode==sel.m).length;
 app.innerHTML=`<h1>國文形音義練習</h1><p class="m">選課程與題型，用輸入法作答，不計時。</p>
 <h2>課程（可複選）</h2><div class="row">${L.map(l=>`<button class="${sel.l.has(l)?'on':''}" data-l="${l}">${l}</button>`).join('')}</div>
 <h2>題型</h2><div class="row">${M.map(([m,t])=>`<button class="${sel.m==m?'on':''}" data-m="${m}">${t}</button>`).join('')}</div>
 <button class="go" id="go">開始練習（${n} 題）</button><hr>
 <p>錯題本：<b>${W.size}</b> 題</p><div class="row"><button id="rv" ${W.size?'':'disabled'}>複習錯題</button><button id="clr" class="ghost" ${W.size?'':'disabled'}>清空錯題</button></div>`;
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const l=b.dataset.l;if(sel.l.has(l)){if(sel.l.size>1)sel.l.delete(l)}else sel.l.add(l);home()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sel.m=b.dataset.m;home()});
 $('#go').onclick=()=>start(Q.filter(q=>sel.l.has(q.lesson)&&q.mode==sel.m));
 $('#rv').onclick=()=>start(Q.filter(q=>W.has(q.id)));
 $('#clr').onclick=()=>{if(confirm('確定清空錯題？')){W.clear();sv();home()}};
}
function start(list){if(!list.length)return;S={list:sh(list),i:0,ok:0,bad:0,done:false};show()}
const inp=(i,q)=>`<input data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.type=='zy'?'注音':q.type=='han'?'國字':''}">`;
function show(){
 if(S.i>=S.list.length)return fin();
 const q=S.list[S.i];S.done=false;
 let body;
 if(q.t){body=`${q.html}：${q.t.map((t,i)=>t+(i<q.ans.length?inp(i,q):'')).join('')}`}
 else body=`${q.html}<div class="ins">${q.ans.map((_,i)=>inp(i,q)).join('')}</div>`;
 app.innerHTML=`<div class="bar"><span>${q.lesson}・${q.mode}${S.rev?'':''}</span><span>${S.i+1} / ${S.list.length}</span></div>
 <div class="card"><div class="q">${body}</div><div id="res"></div></div>
 <div class="row" style="margin-top:12px"><button id="sub" class="on">送出</button><button id="home" class="ghost">回首頁</button></div>`;
 $('#sub').onclick=submit;$('#home').onclick=home;
 app.querySelector('input').focus();
}
function submit(){
 if(S.done)return next();
 const q=S.list[S.i],ins=[...app.querySelectorAll('input')];
 const ok=ins.every((el,i)=>(q.accept?.[i]||[q.ans[i]]).some(a=>norm(el.value,q.type)==norm(a,q.type))&&norm(el.value,q.type)!=='');
 S.done=true;ins.forEach((e,i)=>{e.disabled=true;const g=norm(e.value,q.type)!==''&&(q.accept?.[i]||[q.ans[i]]).some(a=>norm(e.value,q.type)==norm(a,q.type));e.style.borderColor=g?'var(--ok)':'var(--bad)';e.style.color=g?'var(--ok)':'var(--bad)'});
 if(ok){S.ok++;W.delete(q.id)}else{S.bad++;W.add(q.id)}sv();
 $('.card').classList.add(ok?'okc':'badc');
 $('#res').innerHTML=``+(ok?'':`<p>正確答案：<b>${q.ans.map((a,i)=>(q.accept?.[i]||[a]).join('／')).join(' ／ ')}</b></p><button id="ov" class="ghost">我其實答對了</button>`);
 if(ok)S.tm=setTimeout(next,q.mode=='義'?1500:800);
 const ov=$('#ov');if(ov)ov.onclick=()=>{S.ok++;S.bad--;W.delete(q.id);sv();$('#res').innerHTML='';$('.card').classList.replace('badc','okc');app.querySelectorAll('input').forEach(e=>{e.style.borderColor=e.style.color='var(--ok)'})};
 $('#sub').textContent='下一題';
}
function next(){clearTimeout(S.tm);S.i++;show()}
function fin(){
 app.innerHTML=`<h1>練習完成</h1><div class="card"><p>答對 <b class="ok">${S.ok}</b> 題，答錯 <b class="bad">${S.bad}</b> 題</p><p class="m">錯題本目前共 ${W.size} 題</p></div>
 <div class="row" style="margin-top:12px"><button id="home" class="on">回首頁</button><button id="rv" ${W.size?'':'disabled'}>複習錯題</button></div>`;
 $('#home').onclick=home;$('#rv').onclick=()=>start(Q.filter(q=>W.has(q.id)));
}
app.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.isComposing||e.keyCode==229||!S||!e.target.matches('input')&&!S.done)return;
 e.preventDefault();e.stopPropagation();
 const ins=[...app.querySelectorAll('input')],i=ins.indexOf(e.target);
 if(!S.done&&i>=0&&i<ins.length-1)ins[i+1].focus();else submit();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S&&S.done&&!e.isComposing&&!e.target.matches('button')){e.preventDefault();next()}});
home();
</script></body></html>
